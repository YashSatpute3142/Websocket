<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Lifecycle Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            max-width: 750px;
            margin: 40px auto;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        #status {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 3px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #disconnectBtn {
            background: #dc2626;
        }

        #disconnectBtn:hover {
            background: #b91c1c;
        }

        input {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            width: 65%;
            max-width: 400px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #bfdbfe;
        }

        h2 {
            color: #334155;
            margin-top: 30px;
        }

        #events {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 15px 15px 35px;
            min-height: 150px;
            max-height: 350px;
            overflow-y: auto;
        }

        #events li {
            padding: 10px;
            margin-bottom: 8px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 4px;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                margin: 15px;
                padding: 15px;
            }

            input {
                width: 100%;
                max-width: none;
            }

            button {
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

    <h1>WebSocket Lifecycle Demo</h1>

    <p id="status">Disconnected</p>

    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn">Disconnect</button>

    <br><br>

    <input
        type="text"
        id="messageInput"
        placeholder="Enter a message"
    >

    <button id="sendBtn">Send</button>

    <h2>Events</h2>

    <ul id="events"></ul>

    <script>
        let ws = null;

        const status = document.getElementById("status");
        const events = document.getElementById("events");

        function logEvent(message) {
            const li = document.createElement("li");
            li.textContent = message;
            events.appendChild(li);
        }

        function connect() {
            // Avoid creating duplicate connections
            if (
                ws &&
                (
                    ws.readyState === WebSocket.OPEN ||
                    ws.readyState === WebSocket.CONNECTING
                )
            ) {
                logEvent("Already connected or connecting");
                return;
            }

            ws = new WebSocket("ws://localhost:8080");

            status.textContent = "Connecting...";
            status.style.color = "#d97706";
            status.style.background = "#fef3c7";

            logEvent("Connection started");

            ws.addEventListener("open", () => {
                status.textContent = "Connected";
                status.style.color = "#16a34a";
                status.style.background = "#dcfce7";

                logEvent("open event fired");
            });

            ws.addEventListener("message", (event) => {
                const message = JSON.parse(event.data);

                logEvent(
                    `message event: ${JSON.stringify(message)}`
                );
            });

            ws.addEventListener("error", () => {
                logEvent("error event fired");
            });

            ws.addEventListener("close", (event) => {
                status.textContent = "Disconnected";
                status.style.color = "#64748b";
                status.style.background = "#e2e8f0";

                logEvent(
                    `close event: code=${event.code}, ` +
                    `reason=${event.reason}, ` +
                    `clean=${event.wasClean}`
                );
            });
        }

        function disconnect() {
            if (
                ws &&
                (
                    ws.readyState === WebSocket.OPEN ||
                    ws.readyState === WebSocket.CONNECTING
                )
            ) {
                ws.close(1000, "User requested disconnect");
            } else {
                logEvent("No active connection");
            }
        }

        document.getElementById("connectBtn")
            .addEventListener("click", connect);

        document.getElementById("disconnectBtn")
            .addEventListener("click", disconnect);

        document.getElementById("sendBtn")
            .addEventListener("click", () => {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    logEvent("Cannot send: connection is not open");
                    return;
                }

                const input =
                    document.getElementById("messageInput");

                ws.send(input.value);
                logEvent(`Sent message: ${input.value}`);

                input.value = "";
            });
    </script>

</body>

</html>
