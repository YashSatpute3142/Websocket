
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Session 3</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;

            background: #1e293b;
            padding: 40px;

            border-radius: 20px;
            border: 1px solid #334155;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;

            color: #38bdf8;
            font-size: 38px;
        }

        #status {
            text-align: center;

            margin-bottom: 25px;
            padding: 14px;

            border-radius: 10px;
            background: #334155;

            color: #facc15;
            font-size: 16px;
        }

        .input-group {
            display: flex;
            gap: 12px;

            margin-bottom: 30px;
        }

        input {
            flex: 1;
            min-width: 0;

            padding: 15px 20px;

            border: 1px solid #475569;
            border-radius: 10px;

            outline: none;

            background: #0f172a;
            color: white;

            font-size: 16px;
        }

        input:focus {
            border-color: #38bdf8;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 15px 25px;

            border: none;
            border-radius: 10px;

            background: #0284c7;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        button:hover {
            background: #0369a1;
        }

        button:active {
            transform: scale(0.97);
        }

        h2 {
            font-size: 22px;
            margin-bottom: 15px;

            color: #cbd5e1;
        }

        #messages {
            list-style: none;

            display: flex;
            flex-direction: column;
            gap: 10px;

            max-height: 300px;
            overflow-y: auto;
        }

        #messages li {
            padding: 15px 20px;

            background: #334155;
            border-radius: 10px;

            overflow-wrap: anywhere;

            border-left: 3px solid #38bdf8;

            font-size: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WebSocket Test</h1>

        <p id="status">Connecting...</p>

        <div class="input-group">
            <input
                type="text"
                id="message"
                placeholder="Type a message"
            >

            <button id="send">Send</button>
        </div>

        <h2>Messages</h2>

        <ul id="messages"></ul>

    </div>

    <script>
        const status = document.getElementById("status");
        const input = document.getElementById("message");
        const sendBtn = document.getElementById("send");
        const messages = document.getElementById("messages");

        const socket = new WebSocket("ws://localhost:8080");

        function addMessage(text) {
            const item = document.createElement("li");

            item.textContent = text;

            messages.appendChild(item);
        }

        socket.addEventListener("open", () => {
            status.textContent = "Connected";
            status.style.color = "#4ade80";
        });

        socket.addEventListener("message", (event) => {
            addMessage(event.data);
        });

        socket.addEventListener("close", () => {
            status.textContent = "Disconnected";
            status.style.color = "#f87171";
        });

        socket.addEventListener("error", () => {
            status.textContent = "Connection error";
            status.style.color = "#f87171";
        });

        sendBtn.addEventListener("click", () => {
            if (socket.readyState !== WebSocket.OPEN) {
                addMessage("Connection is not open");
                return;
            }

            socket.send(input.value);

            input.value = "";
        });
    </script>

</body>
</html>
