
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Security</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        #status {
            background: #dcfce7;
            color: #166534;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #334155;
        }

        #messages {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        #messages li {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            padding: 12px 14px;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 18px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>WebSocket Security</h1>

        <p id="status">Connecting...</p>

        <div class="input-group">
            <input
                type="text"
                id="message"
                placeholder="Enter message"
            >

            <button id="send">Send</button>
        </div>

        <h2>Messages</h2>
        <ul id="messages"></ul>
    </div>

    <script>
        const status = document.getElementById("status");
        const messageInput = document.getElementById("message");
        const sendButton = document.getElementById("send");
        const messages = document.getElementById("messages");

        const ws = new WebSocket("ws://localhost:8080");

        ws.addEventListener("open", () => {
            status.textContent = "Connected securely";
        });

        ws.addEventListener("message", (event) => {
            const data = JSON.parse(event.data);
            const li = document.createElement("li");

            li.textContent = `${data.type}: ${data.messages}`;

            messages.appendChild(li);
        });

        ws.addEventListener("error", () => {
            status.textContent = "Connection error";
        });

        ws.addEventListener("close", () => {
            status.textContent = "Disconnected";
        });

        sendButton.addEventListener("click", () => {
            if (ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const text = messageInput.value;

            ws.send(JSON.stringify({
                text: text
            }));

            messageInput.value = "";
        });
    </script>
</body>
</html>
