
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Rooms</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 18px;
            color: #334155;
            margin-bottom: 15px;
        }

        h3 {
            color: #334155;
            margin-bottom: 15px;
        }

        #status {
            text-align: center;
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 14px;
        }

        .section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 150px;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .leave-button {
            background: #dc2626;
        }

        .leave-button:hover {
            background: #b91c1c;
        }

        .private-button {
            background: #7c3aed;
        }

        .private-button:hover {
            background: #6d28d9;
        }

        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 22px 0;
        }

        #messages {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        #messages li {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            padding: 12px 14px;
            border-radius: 7px;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 20px 15px;
            }

            .input-group {
                flex-direction: column;
            }

            input {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>WebSocket Room Chat</h1>

        <p id="status">Connecting...</p>

        <div class="section">
            <h2>User Registration</h2>
            <div class="input-group">
                <input id="username" placeholder="Username">
                <button id="register">Register</button>
            </div>
        </div>

        <div class="section">
            <h2>Room Management</h2>
            <div class="input-group">
                <input id="room" placeholder="Room name">
                <button id="join">Join Room</button>
                <button id="leave" class="leave-button">Leave Room</button>
            </div>
        </div>

        <div class="section">
            <h2>Room Messaging</h2>
            <div class="input-group">
                <input id="roomMessage" placeholder="Room message">
                <button id="sendRoom">Send to Room</button>
            </div>
        </div>

        <div class="section">
            <h2>Private Messaging</h2>
            <div class="input-group">
                <input id="receiver" placeholder="Receiver username">
                <input id="privateMessage" placeholder="Private message">
                <button id="sendPrivate" class="private-button">Send Private Message</button>
            </div>
        </div>

        <div class="section">
            <h2>Messages</h2>
            <ul id="messages"></ul>
        </div>

    </div>

    <script>

        const ws = new WebSocket("ws://localhost:8080");

        const status = document.getElementById("status");
        const messages = document.getElementById("messages");

        function send(data) {

            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        function display(data) {

            const li = document.createElement("li");

            li.textContent = JSON.stringify(data);

            messages.appendChild(li);
        }

        ws.onopen = () => {
            status.textContent = "Connected";
        };

        ws.onmessage = (event) => {

            const data = JSON.parse(event.data);

            display(data);
        };

        ws.onclose = () => {
            status.textContent = "Disconnected";
        };

        document.getElementById("register").onclick = () => {

            send({
                type: "REGISTER",
                username: document.getElementById("username").value
            });
        };

        document.getElementById("join").onclick = () => {

            send({
                type: "JOIN_ROOM",
                room: document.getElementById("room").value
            });
        };

        document.getElementById("leave").onclick = () => {

            send({
                type: "LEAVE_ROOM",
                room: document.getElementById("room").value
            });
        };

        document.getElementById("sendRoom").onclick = () => {

            send({
                type: "ROOM_MESSAGE",
                room: document.getElementById("room").value,
                text: document.getElementById("roomMessage").value
            });
        };

        document.getElementById("sendPrivate").onclick = () => {

            send({
                type: "PRIVATE_MESSAGE",
                to: document.getElementById("receiver").value,
                text: document.getElementById("privateMessage").value
            });
        };

    </script>

</body>

</html>
